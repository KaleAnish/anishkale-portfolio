      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0.10"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <circle cx="1080" cy="100" r="320" fill="#38bdf8" fill-opacity="0.04"/>
  <circle cx="1140" cy="560" r="200" fill="#2dd4bf" fill-opacity="0.05"/>
  <circle cx="60"   cy="540" r="240" fill="#1e40af" fill-opacity="0.06"/>

